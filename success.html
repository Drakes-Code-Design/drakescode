<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Sent | Drakes Code &amp; Design</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=erode@500,501&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1555e8; --primary-dark:#0c3fc1; --navy:#07152f; --navy-2:#0d2145;
    --paper:#ffffff; --sky:#74cbff;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px;
    font-family:"Satoshi",system-ui,sans-serif; color:var(--paper);
    background:radial-gradient(60% 50% at 75% 20%, color-mix(in srgb, var(--sky) 35%, transparent), transparent 70%), var(--primary);
  }
  main{
    width:min(100%,580px); padding:56px 44px; text-align:center; border-radius:28px;
    background:var(--navy); box-shadow:0 30px 80px color-mix(in srgb, var(--navy) 45%, transparent);
  }
  .check{
    display:grid; place-items:center; width:60px; height:60px; margin:0 auto 26px; border-radius:50%;
    background:var(--primary); font-size:26px;
  }
  h1{font-family:"Erode",Georgia,serif; font-weight:500; font-size:clamp(36px,6vw,50px); line-height:1.05; margin-bottom:16px}
  h1 em{color:var(--sky)}
  p{color:color-mix(in srgb, var(--paper) 72%, transparent); line-height:1.6; margin:0 auto 32px; max-width:42ch}
  a{
    display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:999px;
    background:var(--paper); color:var(--primary); font-weight:700; text-decoration:none;
    transition:background .2s, color .2s;
  }
  a:hover{background:var(--sky); color:var(--navy)}
  a:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="check" aria-hidden="true">✓</span>
  <h1>Message <em>sent.</em></h1>
  <p>Thanks for reaching out. I’ve received your inquiry and will get back to you within 24–48 hours.</p>
  <a href="index.html">Back to home <span aria-hidden="true">↗</span></a>
</main>
</body>
</html>
